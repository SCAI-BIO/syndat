[project]
name = "syndat"
version = "0.0.3"
description = "A library for evaluation & visualization of synthetic data."
authors = [{ name = "Tim Adams", email = "tim.adams@scai.fraunhofer.de" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = { file = "LICENSE" }

keywords = [
    "synthetic-data",
    "data-quality",
    "data-visualization",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
    "plotnine>=0.13,<1",
    "shap>=0.48,<1",
]

[project.urls]
Homepage = "https://github.com/SCAI-BIO/syndat"
Repository = "https://github.com/SCAI-BIO/syndat"
documentation = "https://github.com/SCAI-BIO/syndat#readme"
source = "https://github.com/SCAI-BIO/syndat"
tracker = "https://github.com/SCAI-BIO/syndat/issues"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "nox>=2026.2,<2027",
]

docs = [
    "sphinx>=7,<9",
    "sphinx-autodoc-typehints>=2,<4",
    "sphinx-rtd-theme>=3,<4",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"
