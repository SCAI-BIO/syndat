[project]
name = "syndat"
version = "0.0.3"
description = "Python library to evaluate and visualize the quality of synthetic patient and clinical trial data using distribution, correlation and discrimination metrics."
authors = [{ name = "Tim Adams", email = "tim.adams@scai.fraunhofer.de" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
    "synthetic-data",
    "synthetic-patient-data",
    "clinical-data",
    "synthetic-data-evaluation",
    "data-fidelity",
    "data-quality",
    "data-visualization",
    "health-informatics",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.0",
    "shap>=0.48",
    "plotnine>=0.15.9",
    "numpy>=1.26.2",
    "scipy>=1.11.4",
]

[project.urls]
Homepage = "https://github.com/SCAI-BIO/syndat"
Repository = "https://github.com/SCAI-BIO/syndat"
documentation = "https://syndat.readthedocs.io"
source = "https://github.com/SCAI-BIO/syndat"
tracker = "https://github.com/SCAI-BIO/syndat/issues"
Changelog = "https://github.com/SCAI-BIO/syndat/releases"
Zenodo = "https://doi.org/10.5281/zenodo.15791976"
Dashboard = "https://syndat.scai.fraunhofer.de"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.2.1",
    "flake8>=7.3.0",
    "nox>=2026.2.9",
]
docs = [
    "sphinx>=7.0,<9.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-rtd-theme>=3.0.2",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
